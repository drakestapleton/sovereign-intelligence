<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Omega Play — VerdantUI Observer Bridge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="pop">
    <header class="head">
      <span class="kicker">OMEGA PLAY MV3 · ZERO-CHEAT</span>
      <h1>Browser Game Pacer &amp; VerdantUI Observer</h1>
    </header>
    <div class="actions">
      <button id="btn-attach" class="btn primary" type="button">1. Monitor Active Game Tab</button>
      <button id="btn-silence" class="btn" type="button">2. Silence Background Tabs (Free GC/CPU)</button>
      <button id="btn-verdant" class="btn" type="button">3. Open VerdantUI Observer</button>
      <button id="btn-native" class="btn" type="button">4. Probe Local AienOS omega-play (DRY_RUN)</button>

    <pre id="status" class="log">Ready. Click button 1 on any browser game tab to stream live p99/1%-low telemetry straight into VerdantUI's ObserverStreamBus.</pre>
    <footer class="foot">
      <a href="https://www.aienos.com/v1/#si-play" target="_blank" rel="noopener">AienOS /v1/ Arena &amp; .holo</a>
      <a href="https://afflom.github.io/VerdantUI/" target="_blank" rel="noopener">VerdantUI Observer</a>
    </footer>
  </main>
  <script src="popup.js"></script>
